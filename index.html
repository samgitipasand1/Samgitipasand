<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sam Gitipasand</title>
    <style>
        /* اصلاح ساختار برای جلوگیری از به‌هم‌ریختگی */
        body { font-family: Tahoma, sans-serif; background: #081018; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        .gallery { display: flex; gap: 10px; overflow-x: auto; height: 300px; }
        .gallery img { height: 100%; border-radius: 15px; transition: 0.5s; cursor: pointer; }
        .gallery img:hover { transform: scale(1.05); }
        .section { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 20px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>خوش آمدید</h1>
        <div class="gallery">
            <img src="1Sam.jpg" alt="Sam">
            <img src="3sam.jpg" alt="Sam">
            <img src="4sam.jpg" alt="Sam">
        </div>
        <div class="section">
            <h2>درباره من</h2>
            <p>سام گیتی‌پسند - بازیگر</p>
        </div>
    </div>
</body>
</html>
